  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <text x="64" y="188" fill="#111111" font-size="42" font-weight="400">Incubator Week v5</text>
  <text x="64" y="260" fill="#111111" font-size="43" font-weight="600">5 days in San Francisco. All expenses paid.</text>
  <text x="64" y="326" fill="#111111" font-size="43" font-weight="600">Up to $100k in funding if we back your pitch.</text>

  <text x="64" y="568" fill="#111111" font-size="28" font-weight="400">August 24–28 · Apply by August 14</text>
