# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-GB"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: false
  review_status: true
  review_details: false
  commit_status: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  path_instructions:
    - path: "libraries/db/src/schema.ts"
      instructions: |
        These tables are synced to Postgres by pg-sync-service. Code that uses a new column can run
        before pg-sync-service has added it, which breaks staging, so schema changes ship ahead of
        the code that uses them. Comment ONLY when a change appears to skip the migration process
        below; stay silent on unrelated edits.
        - A column is added to a `pgAirtable` table and the same PR also reads or writes it outside
          `libraries/db` (application code, not tests or fixtures). Adding a column is two PRs: add
          it to the schema and merge, wait for a sync, then use it. Plain `pgTable` and
          `deprecationSafePgTable` tables aren't synced from Airtable, so adding and using one of
          their columns in the same PR is fine.
        - A column is deleted outright instead of first being moved into the table's
          `deprecatedColumns`. Safe removal is two PRs: move to `deprecatedColumns` (nullable),
          merge and deploy to prod, then delete.
        - A column key is renamed in one step rather than add-new -> migrate-consumers ->
          deprecate-old.
        - For plain `pgTable`s, which don't support deprecatedColumns, still comment if a column
          is deleted. Prompt the user to explain why it is safe to drop the column straight away,
          rather than first migrating to `deprecationSafePgTable` (either approach may be acceptable).
        See CLAUDE.md "Database / schema changes".
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "DRAFT"
    drafts: false
    base_branches:
      - "master"
      - "main"
chat:
  auto_reply: true
